# ==============================================================================
# RANKFORGE PRODUCTION ENVIRONMENT PROFILE (application-prod.properties)
# ==============================================================================

# Server binding for cloud hosting (Render provides PORT, bind to 0.0.0.0)
server.port=${PORT:8080}
server.address=0.0.0.0

# Database Configuration for Neon PostgreSQL
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rankforgedb}}
spring.datasource.driver-class-name=${DB_DRIVER:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# HikariCP Connection Pool settings optimized for Neon serverless & Render Free tier (512MB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# Operational Safeguards: Destructive anonymous roster reset is disabled in production
rankforge.demo.reset-enabled=${RANKFORGE_RESET_ENABLED:false}

# Flyway: Baseline on migrate enabled for clean initial migration on Neon PostgreSQL
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate: Validate-only schema enforcement against Flyway tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS: Allowed origins for Vercel production deployment
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://rankforge-dsa.vercel.app}
