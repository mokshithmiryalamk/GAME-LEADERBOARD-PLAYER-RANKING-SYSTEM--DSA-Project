# ==============================================================================
# RANKFORGE PRODUCTION ENVIRONMENT PROFILE (application-prod.properties)
# ==============================================================================

# Operational Safeguards: Destructive anonymous roster reset is disabled by default in production
rankforge.demo.reset-enabled=${RANKFORGE_RESET_ENABLED:false}

# Flyway: Validates schema migrations without automatic baseline creation in production
spring.flyway.baseline-on-migrate=false

# Hibernate: Validate-only schema enforcement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
