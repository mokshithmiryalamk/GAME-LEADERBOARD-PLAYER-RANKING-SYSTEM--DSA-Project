spring.application.name=rankforge-backend
server.port=8080
server.error.include-message=always

# Database Configuration (H2 file-based for local dev, PostgreSQL ready via env vars)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/rankforgedb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;WRITE_DELAY=0}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate (Flyway validates and manages schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Path to original source players.txt seed data
rankforge.data.players-file=original-source/players.txt

# Operational Safeguards
# Allow anonymous demo reset in local dev, overrideable via RANKFORGE_RESET_ENABLED env var
rankforge.demo.reset-enabled=${RANKFORGE_RESET_ENABLED:true}
